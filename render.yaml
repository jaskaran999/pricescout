services:
  - type: web
    name: pricescout
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pricescout-db
          property: connectionString
databases:
  - name: pricescout-db
    databaseName: pricescout
    user: pricescout
